<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>管理员控制台 - 学生成绩管理系统</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f7f6; }
    .navbar { background-color: #343a40; }
    .navbar-brand, .nav-link { color: white !important; }
    .card { transition: transform 0.2s; cursor: pointer; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
    .icon { font-size: 50px; color: #007bff; margin-bottom: 15px; }
  </style>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="#">管理员控制台</a>
    <div class="d-flex">
      <span class="navbar-text me-3" style="color: #ccc;" id="welcomeMsg"></span>
      <button class="btn btn-danger btn-sm" onclick="logout()">退出登录</button>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center text-center">

    <!-- 用户信息管理卡片 -->
    <div class="col-md-4 mb-4">
      <div class="card p-5" onclick="window.location.href='user_list.html'">
        <div class="icon">👥</div>
        <h3>用户信息管理</h3>
        <p class="text-muted">管理学生、教师及管理员账号</p>
      </div>
    </div>

    <!-- 课程信息管理卡片 -->
    <div class="col-md-4 mb-4">
      <div class="card p-5" onclick="window.location.href='course_list.html'">
        <div class="icon" style="color: #28a745;">📚</div>
        <h3>课程信息管理</h3>
        <p class="text-muted">管理课程、任课教师及学生成绩</p>
      </div>
    </div>

  </div>
</div>

<script>
  function logout() {
    if(confirm("确定要退出登录吗？")) {
      window.location.href = "logout";
    }
  }
</script>
</body>
</html>
