<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>班级信息管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <style> body{padding:20px;background:#f8f9fa;} .table-container{background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.1);} </style>
</head>
<body>
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>班级信息列表</h3>
        <div>
            <button class="btn btn-success" onclick="window.location.href='class_add.html'">新建班级</button>
            <button class="btn btn-secondary" onclick="window.location.href='admin_dashboard.html'">返回控制台</button>
        </div>
    </div>

    <div class="table-container">
        <!-- 服务端搜索 -->
        <div class="input-group mb-3" style="max-width:500px;">
            <input type="text" id="kw" class="form-control" placeholder="搜索班级编号/名称/班主任工号/姓名...">
            <button class="btn btn-primary" onclick="loadClasses()">搜索</button>
            <button class="btn btn-outline-secondary" onclick="$('#kw').val('');loadClasses();">清空</button>
        </div>

        <table id="classTable" class="table table-striped table-bordered table-hover" style="width:100%">
            <thead>
            <tr>
                <th>ID</th><th>班级编号</th><th>班级名称</th>
                <th>班主任工号</th><th>班主任姓名</th><th>操作</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script>
    var dt = null;
    function loadClasses() {
        $.post("class_query", {keyword: $("#kw").val()}, function(res) {
            if (res.result_code !== 0) return alert("加载失败：" + res.result_msg);
            if (dt) dt.destroy();
            $("#classTable tbody").empty();
            res.aaData.forEach(function(c) {
                var tr = "<tr>";
                tr += "<td>" + c.id + "</td>";
                tr += "<td>" + c.class_no + "</td>";
                tr += "<td>" + c.class_name + "</td>";
                tr += "<td>" + c.head_teacher_no + "</td>";
                tr += "<td>" + c.head_teacher_name + "</td>";
                tr += "<td>";
                tr += "<button class='btn btn-sm btn-info me-1' onclick='modifyClass(" + c.id + ")'>修改</button>";
                tr += "<button class='btn btn-sm btn-primary me-1' onclick='viewStudents(" + c.id + ")'>查看</button>";
                tr += "<button class='btn btn-sm btn-danger' onclick='delClass(" + c.id + ")'>删除</button>";
                tr += "</td></tr>";
                $("#classTable tbody").append(tr);
            });
            dt = $("#classTable").DataTable({
                pageLength: 10, searching: false, ordering: true,
                oLanguage: {sZeroRecords: "暂无班级", oPaginate: {sPrevious:"上页", sNext:"下页"}}
            });
        });
    }
    function delClass(id) {
        if (!confirm("确定删除该班级？班内学生将被移出班级（不会删除学生账号）。")) return;
        $.post("class_delete", {id: id}, function(res) {
            if (res.result_code === 0) { alert("删除成功"); loadClasses(); }
            else alert("删除失败：" + res.result_msg);
        });
    }
    function modifyClass(id) { window.location.href = "class_modify.html?id=" + id; }
    function viewStudents(id) { window.location.href = "class_student_list.html?class_id=" + id; }
    $(loadClasses);
</script>
</body>
</html>
