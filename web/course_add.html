<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>添加课程</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style> body { padding: 50px; background-color: #f8f9fa; } .form-box { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);} </style>
</head>
<body>
<div class="form-box">
    <h3 class="mb-4">添加新课程</h3>
    <div class="mb-3">
        <label>课程号：</label>
        <input type="text" id="course_no" class="form-control" placeholder="例如：CS101">
    </div>
    <div class="mb-3">
        <label>课序号：</label>
        <input type="text" id="course_seq_no" class="form-control" placeholder="例如：01">
    </div>
    <div class="mb-3">
        <label>课程名：</label>
        <input type="text" id="course_name" class="form-control" placeholder="例如：Java Web 开发">
    </div>
    <button class="btn btn-success w-100" onclick="submitCourse()">确认添加</button>
    <button class="btn btn-secondary w-100 mt-2" onclick="window.location.href='course_list.html'">返回列表</button>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script>
    function submitCourse() {
        var data = {
            "course_no": $("#course_no").val(),
            "course_seq_no": $("#course_seq_no").val(),
            "course_name": $("#course_name").val()
        };
        if(!data.course_no || !data.course_name) return alert("课程号和课程名不能为空！");

        $.post("course_add", data, function(res) {
            if(res.result_code === 0) {
                alert("添加成功！");
                window.location.href = "course_list.html";
            } else {
                alert("添加失败：" + res.result_msg);
            }
        });
    }
</script>
</body>
</html>
