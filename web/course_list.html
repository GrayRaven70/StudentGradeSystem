<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>课程信息管理</title>
  <!-- 引入 Bootstrap 和 DataTables 的 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <style>
    body { padding: 20px; background-color: #f8f9fa; }
    .table-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

<div class="container-fluid">
  <!-- 顶部操作栏 -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>课程信息列表</h3>
    <div>
      <button class="btn btn-success" onclick="addCourse()">添加课程</button>
      <button class="btn btn-secondary" onclick="window.location.href='admin_dashboard.html'">返回控制台</button>
    </div>
  </div>

  <!-- 表格容器 -->
  <div class="table-container">
    <table id="courseTable" class="table table-striped table-bordered table-hover" style="width:100%">
      <thead>
      <tr>
        <th>课程号</th>
        <th>课序号</th>
        <th>课程名</th>
        <th>任课教师</th>
        <th>操作</th>
      </tr>
      </thead>
      <tbody>
      <!-- 数据由 Ajax 动态填充 -->
      </tbody>
    </table>
  </div>
</div>

<!-- 引入 jQuery 和 DataTables 的 JS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
  var dataTableInstance = null;

  // 加载课程数据
  function loadCourses() {
    $.post("course_query", {}, function(res) {
      if (res.result_code === 0) {
        var list = res.aaData;

        // 如果表格已经初始化过，先销毁它（防止重复初始化报错）
        if (dataTableInstance) {
          dataTableInstance.destroy();
        }

        // 清空旧数据
        $("#courseTable tbody").empty();

        // 循环遍历数据，拼接 HTML
        for (var i = 0; i < list.length; i++) {
          var c = list[i];
          var tr = "<tr>";
          tr += "<td>" + c.course_no + "</td>";
          tr += "<td>" + c.course_seq_no + "</td>";
          tr += "<td>" + c.course_name + "</td>";
          tr += "<td>" + c.teachers + "</td>";
          tr += "<td>";
          // 修改课程信息
          tr += "<button class='btn btn-sm btn-info me-1' onclick='modifyCourse(" + c.id + ")'>修改课程</button>";
          // 管理学生信息（跳转带 mode=modify）
          tr += "<button class='btn btn-sm btn-warning me-1' onclick='manageStudents(" + c.id + ", \"modify\")'>管理学生</button>";
          // 查看学生信息（跳转带 mode=view）
          tr += "<button class='btn btn-sm btn-secondary me-1' onclick='manageStudents(" + c.id + ", \"view\")'>查看学生</button>";
          // 删除课程
          tr += "<button class='btn btn-sm btn-danger' onclick='deleteCourse(" + c.id + ")'>删除</button>";
          tr += "</td>";
          tr += "</tr>";

          $("#courseTable tbody").append(tr);
        }

        // 初始化 DataTables 插件（开启分页、搜索、排序）
        dataTableInstance = $('#courseTable').DataTable({
          "pageLength": 10,
          "oLanguage": {
            "sSearch": "搜索课程:",
            "sZeroRecords": "没有匹配的课程",
            "sInfo": "显示第 _START_ 至 _END_ 项记录，共 _TOTAL_ 项",
            "sInfoEmpty": "显示第 0 至 0 项记录，共 0 项",
            "oPaginate": {
              "sFirst": "首页",
              "sPrevious": "上页",
              "sNext": "下页",
              "sLast": "末页"
            }
          }
        });
      } else {
        alert("数据加载失败：" + res.result_msg);
      }
    });
  }

  // 页面加载完成后立即执行
  $(document).ready(function() {
    loadCourses();
  });

  // 各种操作跳转函数
  function addCourse() {
    window.location.href = "course_add.html";
  }

  function deleteCourse(id) {
    if(confirm("确定要删除这门课程吗？删除后关联的教师和学生记录也会消失！")) {
      $.post("course_delete", {"id": id}, function(res) {
        if(res.result_code === 0) {
          alert("删除成功！");
          loadCourses(); // 重新加载表格，不要刷新整个页面
        } else {
          alert("删除失败：" + res.result_msg);
        }
      });
    }
  }
  function modifyCourse(id) {
    // 跳转到修改课程页面，并带上课程ID
    window.location.href = "course_modify.html?id=" + id;
  }

  function manageStudents(id, mode) {
    // 跳转到学生管理页面，带上课程ID和操作模式（modify 或 view）
    window.location.href = "course_student_modify.html?course_id=" + id + "&mode=" + mode;
  }
</script>
</body>
</html>
