<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的账户</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style> body{padding:40px;background:#f8f9fa;} .box{max-width:600px;margin:0 auto;background:#fff;padding:30px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.1);} </style>
</head>
<body>
<div class="box">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>我的账户</h3>
    <button class="btn btn-secondary" onclick="location.href='student_dashboard.html'">返回</button>
  </div>
  <div class="mb-3">
    <label class="form-label">学号</label>
    <input type="text" id="userNo" class="form-control" readonly>
  </div>
  <div class="mb-3">
    <label class="form-label">姓名</label>
    <input type="text" id="realName" class="form-control" readonly>
  </div>
  <hr>
  <h5>修改密码</h5>
  <form action="changePassword" method="post" onsubmit="return checkPwd()">
    <input type="hidden" name="loginType" value="student">
    <input type="hidden" name="userNo" id="pwdUserNo">
    <div class="mb-3">
      <label class="form-label">原密码</label>
      <input type="password" name="oldPassword" id="oldPassword" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">新密码</label>
      <input type="password" name="newPassword" id="newPassword" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">确认修改</button>
  </form>
</div>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script>
  $(function() {
    $.post("student_account_query", {}, function(res) {
      if (res.result_code !== 0) { alert("加载失败：" + res.result_msg); return; }
      $("#userNo").val(res.data.user_no);
      $("#realName").val(res.data.real_name);
      $("#pwdUserNo").val(res.data.user_no);
    });
  });
  function checkPwd() {
    if ($("#oldPassword").val() === $("#newPassword").val()) {
      alert("新密码不能与原密码相同"); return false;
    }
    return true;
  }
</script>
</body>
</html>
