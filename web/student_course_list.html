<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><title>学生选课与成绩</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <style>body{padding:20px;background:#f8f9fa;}.table-container{background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.1);}</style>
</head>
<body>
<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>学生选课与成绩</h3>
    <div>
      <button class="btn btn-info" onclick="exportCourses()">导出</button>
      <button class="btn btn-secondary" onclick="history.back()">返回</button>
    </div>
  </div>
  <div class="table-container">
    <table id="courseTable" class="table table-striped table-bordered table-hover" style="width:100%">
      <thead><tr><th>课程名称</th><th>课程号</th><th>课序号</th><th>成绩</th><th>是否及格</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var studentId = params.get('student_id');
  var studentNo = params.get('student_no') || studentId;
  var dt = null;
  function loadCourses() {
    $.post("student_course_query", {student_id: studentId}, function(res) {
      if (res.result_code !== 0) return alert("加载失败");
      if (dt) dt.destroy();
      $("#courseTable tbody").empty();
      res.aaData.forEach(function(c) {
        var tr = "<tr>";
        tr += "<td>" + c.course_name + "</td>";
        tr += "<td>" + c.course_no + "</td>";
        tr += "<td>" + c.course_seq_no + "</td>";
        if (c.score === 'null') tr += "<td><span class='text-danger'>未录入</span></td>";
        else tr += "<td>" + c.score + "</td>";
        if (c.pass === '未录入') tr += "<td><span class='text-secondary'>未录入</span></td>";
        else if (c.pass === '及格') tr += "<td><span class='text-success fw-bold'>及格</span></td>";
        else tr += "<td><span class='text-danger fw-bold'>不及格</span></td>";
        tr += "</tr>";
        $("#courseTable tbody").append(tr);
      });
      dt = $("#courseTable").DataTable({
        pageLength: 10,
        oLanguage: {sSearch: "搜索课程:", sZeroRecords: "暂无选课记录",
          oPaginate: {sPrevious:"上页", sNext:"下页"}}
      });
    });
  }
  function exportCourses() {
    window.location.href = "student_course_export?student_id=" + studentId + "&student_no=" + encodeURIComponent(studentNo);
  }
  $(loadCourses);
</script>
</body>
</html>
