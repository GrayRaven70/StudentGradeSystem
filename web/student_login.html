<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>管理员登录</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6; font-family: sans-serif; margin: 0; }
    .login-box { background: white; padding: 30px 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    .login-box h2 { margin-bottom: 20px; color: #333; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #666; }
    .input-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .btn-login { width: 100%; padding: 10px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    .btn-login:hover { background-color: #c82333; }
    .back-link { display: block; margin-top: 15px; font-size: 14px; color: #666; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="login-box">
  <h2>管理员登录</h2>

  <!-- 注意：这里用 onsubmit 拦截表单的默认提交，改用 JS 验证 -->
  <form onsubmit="return checkLogin(event)">
    <div class="input-group">
      <label>账号</label>
      <input type="text" id="username" placeholder="请输入管理员账号">
    </div>
    <div class="input-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button type="submit" class="btn-login">登 录</button>
  </form>

  <a href="index.jsp" class="back-link">返回角色选择</a>
</div>

<script>
  function checkLogin(event) {
    // 阻止表单的默认刷新行为
    event.preventDefault();

    // 获取用户输入
    var user = document.getElementById("username").value;
    var pwd = document.getElementById("password").value;

    // 判断固定账号密码
    if (user === "admin14" && pwd === "123") {
      // 密码正确，跳转到列表页
      window.location.href = "user_list.html";
    } else {
      // 密码错误，弹出提示
      alert("账号或密码错误，请重试！");
    }
  }
</script>

</body>
</html>
