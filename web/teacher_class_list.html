<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><title>我的班级</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>body{padding:20px;background:#f8f9fa;}</style>
</head>
<body>
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>我担任班主任的班级</h3>
    <button class="btn btn-secondary" onclick="location.href='teacher_dashboard.html'">返回</button>
  </div>
  <table class="table table-bordered table-hover bg-white">
    <thead class="table-light"><tr><th>ID</th><th>班级编号</th><th>班级名称</th><th>操作</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script>
  $(function() {
    $.post("teacher_class_query", {}, function(res) {
      if (res.result_code !== 0) return alert("加载失败：" + res.result_msg);
      if (res.aaData.length === 0) {
        $("#tbody").append("<tr><td colspan='4' class='text-center text-muted'>暂无班级</td></tr>");
        return;
      }
      res.aaData.forEach(function(c) {
        var tr = "<tr><td>" + c.id + "</td><td>" + c.class_no + "</td><td>" + c.class_name + "</td>";
        tr += "<td><button class='btn btn-sm btn-primary' onclick='viewStu(" + c.id + ")'>查看学生</button></td></tr>";
        $("#tbody").append(tr);
      });
    });
  });
  function viewStu(id) { location.href = "class_student_list.html?class_id=" + id; }
</script>
</body>
</html>
