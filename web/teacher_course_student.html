<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>课程学生成绩</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <style> body{padding:20px;background:#f8f9fa;} .table-container{background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.1);} </style>
</head>
<body>
<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 id="title">课程学生成绩</h3>
    <div>
      <button class="btn btn-info" id="btnExport" onclick="exportScores()" style="display:none;">导出成绩单</button>
      <button class="btn btn-secondary" onclick="history.back()">返回</button>
    </div>
  </div>
  <div class="table-container">
    <div class="input-group mb-3" style="max-width:400px;">
      <input type="text" id="kw" class="form-control" placeholder="搜索学号或姓名...">
      <button class="btn btn-primary" onclick="loadStudents()">搜索</button>
      <button class="btn btn-outline-secondary" onclick="$('#kw').val('');loadStudents();">清空</button>
    </div>
    <table id="stuTable" class="table table-striped table-bordered table-hover" style="width:100%">
      <thead><tr><th>学号</th><th>姓名</th><th>成绩</th><th id="opCol">操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- 修改成绩弹框 -->
<div class="modal fade" id="scoreModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">修改成绩</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">学号</label>
          <input type="text" id="mUserNo" class="form-control" readonly></div>
        <div class="mb-3"><label class="form-label">姓名</label>
          <input type="text" id="mRealName" class="form-control" readonly></div>
        <div class="mb-3"><label class="form-label">当前成绩</label>
          <input type="text" id="mOldScore" class="form-control" readonly></div>
        <div class="mb-3"><label class="form-label">修改成绩为（留空表示清除成绩）</label>
          <input type="number" id="mNewScore" class="form-control" min="0" max="100" step="0.01"></div>
        <input type="hidden" id="mRelationId">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-primary" onclick="submitScore()">确认</button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var courseId = params.get('course_id');
  var mode = params.get('mode') || 'view';
  var dt = null;
  var scoreModal = null;

  $(function() {
    if (!courseId) { alert("缺少课程ID"); history.back(); return; }
    if (mode === 'modify') {
      $("#title").text("修改学生成绩");
    } else {
      $("#title").text("查看学生成绩（只读）");
      $("#btnExport").show();
      $("#opCol").hide();
    }
    scoreModal = new bootstrap.Modal(document.getElementById('scoreModal'));
    loadStudents();
  });

  function loadStudents() {
    $.post("teacher_course_student_query",
            {course_id: courseId, keyword: $("#kw").val()},
            function(res) {
              if (res.result_code !== 0) { alert("加载失败：" + res.result_msg); return; }
              if (dt) dt.destroy();
              $("#stuTable tbody").empty();
              res.aaData.forEach(function(s) {
                var tr = "<tr>";
                tr += "<td>" + s.user_no + "</td>";
                tr += "<td>" + s.real_name + "</td>";
                if (s.score === 'null') tr += "<td><span class='text-danger'>未录入</span></td>";
                else tr += "<td>" + s.score + "</td>";
                tr += "<td class='op-col'>";
                if (mode === 'modify') {
                  var cur = (s.score === 'null') ? '' : s.score;
                  tr += "<button class='btn btn-sm btn-primary' onclick=\"openScoreModal('"
                          + s.relation_id + "','" + s.user_no + "','" + s.real_name + "','" + cur + "')\">修改成绩</button>";
                } else {
                  tr += "<span class='text-muted'>-</span>";
                }
                tr += "</td></tr>";
                $("#stuTable tbody").append(tr);
              });
              if (mode !== 'modify') $(".op-col").hide();
              dt = $("#stuTable").DataTable({
                pageLength: 10, searching: false,
                oLanguage: {sZeroRecords: "暂无学生", oPaginate: {sPrevious:"上页", sNext:"下页"}}
              });
            });
  }

  function openScoreModal(relationId, userNo, realName, curScore) {
    $("#mRelationId").val(relationId);
    $("#mUserNo").val(userNo);
    $("#mRealName").val(realName);
    $("#mOldScore").val(curScore === '' ? '未录入' : curScore);
    $("#mNewScore").val(curScore);
    scoreModal.show();
  }

  function submitScore() {
    var newScore = $("#mNewScore").val().trim();
    if (newScore !== '') {
      var n = Number(newScore);
      if (isNaN(n) || n < 0 || n > 100) { alert("成绩必须在 0~100 之间"); return; }
    }
    $.post("teacher_score_update",
            {relation_id: $("#mRelationId").val(), score: newScore},
            function(res) {
              if (res.result_code === 0) {
                scoreModal.hide();
                loadStudents();
              } else {
                alert("修改失败：" + res.result_msg);
              }
            });
  }

  function exportScores() {
    location.href = "teacher_course_score_export?course_id=" + courseId;
  }
</script>
</body>
</html>
