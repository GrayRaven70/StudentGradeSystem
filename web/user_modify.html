<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>修改用户信息</title>
    <!-- 引入一点基础样式，让表单好看点 -->
    <style>
        body { padding: 20px; font-family: sans-serif; }
        .form-box { max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: inline-block; width: 80px; }
        .form-group input, .form-group select { width: 250px; padding: 5px; }
        .btn { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-box">
    <h3>修改用户信息</h3>
    <!-- ★ 把 action 改成了 user_modify -->
    <form id="modify_record_form" name="modify_record_form" method="post">
        <input type="hidden" id="id" name="id" value=""/>

        <div class="form-group">
            <label>工号/学号：</label>
            <input type="text" id="user_no" name="user_no" value="" required>
        </div>

        <div class="form-group">
            <label>姓名：</label>
            <input type="text" id="real_name" name="real_name" value="" required>
        </div>

        <div class="form-group">
            <label>用户组：</label>
            <select id="user_group" name="user_group">
                <option value="学生">学生</option>
                <option value="教师">教师</option>
                <option value="管理员">管理员</option>
            </select>
        </div>

        <div class="form-group">
            <label>院系：</label>
            <input type="text" id="department" name="department" value="">
        </div>

        <div class="form-group">
            <label>密码：</label>
            <input type="text" id="password" name="password" value="">
        </div>

        <button type="button" class="btn" onclick="submitModifyRecord();">递交修改</button>
    </form>
    <div id="record_list_div" style="margin-top: 15px; color: green;"></div>
</div>

</body>
</html>

<!-- ★ 引入你本地或者线上的 jQuery（既然之前用了 1.8.3 的本地文件，这里保持，路径去掉了 ../../） -->
<script src="assets/js/jquery-1.8.3.min.js"></script>
<script>
    <!-- 优先使用本地，找不到就换用线上，确保 jQuery 一定加载成功 -->
    <script src="assets/js/jquery-1.8.3.min.js"></script>
<script>
    // 如果本地 jQuery 没加载成功，用线上的
    if (typeof jQuery === 'undefined') {
        document.write('<script src="https://code.jquery.com/jquery-3.7.0.min.js"><\/script>');
    }
</script>

<script>
    $(function() { // 页面加载完成后执行
        var urlId = getUrlParam("id");
        if (urlId) {
            getRecord(urlId);
        } else {
            alert("缺少参数 ID，请从列表页点击修改进入！");
            window.location.href = "user_list.html";
        }
    });

    function submitModifyRecord() {
        var recordId = $("#id").val(); // 从隐藏域获取ID
        console.log("准备提交的 ID:", recordId);

        if (!recordId) {
            alert("无法获取用户 ID，请刷新页面重试！");
            return;
        }

        // 收集表单数据
        var data = {
            "id": recordId,
            "user_no": $("#user_no").val(),
            "real_name": $("#real_name").val(),
            "user_group": $("#user_group").val(),
            "department": $("#department").val(),
            "password": $("#password").val()
        };
        console.log("准备提交的数据:", data);

        // 发送请求
        $.ajax({
            url: "user_modify",
            type: "POST",
            data: data,
            success: function(res) {
                console.log("后端返回:", res);
                if (res.result_code == 0) {
                    alert("修改成功！点击确定返回列表页。");
                    window.location.href = "user_list.html";
                } else {
                    // 如果失败，把原因显示在页面上，不要静默
                    $("#record_list_div").html("<span style='color:red; font-weight:bold;'>修改失败：" + res.result_msg + "</span>");
                }
            },
            error: function(xhr, status, error) {
                console.error("请求失败:", error);
                alert("请求后端失败！请检查是否按了 F12 看到 404 或 500 错误。");
            }
        });
    }

    function getRecord(id) {
        $.post("user_query", {"id": id}, function (res) {
            if (res.result_code == 0 && res.aaData.length > 0) {
                var record = res.aaData[0];
                $("#id").val(record.id);
                $("#user_no").val(record.user_no);
                $("#real_name").val(record.real_name);
                $("#user_group").val(record.user_group);
                $("#department").val(record.department);
                $("#password").val(record.password);
            } else {
                alert("查询不到该用户信息，可能已被删除！");
            }
        });
    }

    function getUrlParam(name) {
        var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
        var r = window.location.search.substr(1).match(reg);
        if(r != null) return decodeURI(r[2]); return null;
    }
</script>
</script>
